name: Node CI

env:
  NODE_VERSION: 24
  APP_NAME: npm-ci-demo
  REGISTRY: ghcr.io
  IMAGE_NAME: williamthangavelu0710/william-demo-cicd
  #DEMO_SECRET: ${{ secrets.DEMO_SECRET }}

permissions:
    contents: read
    packages: write
    
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: 
  
jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check secret
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          echo "The secret was loaded."
          echo "Secret length: ${#DEMO_SECRET}"
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION}}
          cache: npm
      - name: Show environment variables
        run: |
          echo "App name: $APP_NAME"
          echo "Default Node version: $NODE_VERSION"          

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint


  unit-test:
    needs: lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20,22,24]
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node${{matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        
  dependency-scan:
    needs: unit-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan dependencies
        run: npm audit --audit-level=high

  build:
    needs: 
      - unit-test
      - dependency-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: dist/
          
  integration-test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration
        
  docker-build:
    needs: integration-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: dist

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        #run: docker build -t npm-ci-demo .  


          
  verify-artifact:
    needs: integration-test
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: downloaded-build

      - name: Show downloaded files
        run: |
          echo "Downloaded artifact contents:"
          ls -la downloaded-build
